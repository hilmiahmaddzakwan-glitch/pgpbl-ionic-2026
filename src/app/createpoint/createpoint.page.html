<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/maps"></ion-back-button>
    </ion-buttons>
    <ion-title>Create Point</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <form>
    <ion-item>
      <ion-label position="floating">Name</ion-label>
      <ion-input [(ngModel)]="name" name="name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Coordinates</ion-label>
      <ion-input [(ngModel)]="coordinates" name="coordinates"></ion-input>
    </ion-item>

    <div id="mapcreate" style="height: 350px; width: 100%; margin-top: 16px; margin-bottom: 16px;"></div>

    <ion-button expand="full" (click)="save()">Save</ion-button>
  </form>
</ion-content>
