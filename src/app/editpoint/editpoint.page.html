<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/maps"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit Point</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div id="map-edit" style="width: 100%; height: 280px; margin-bottom: 16px;"></div>

  <form>
    <ion-item>
      <ion-label position="floating">Point Name</ion-label>
      <ion-input [(ngModel)]="name" name="name" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Latitude</ion-label>
      <ion-input [(ngModel)]="latitude" name="latitude" type="number" step="any"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Longitude</ion-label>
      <ion-input [(ngModel)]="longitude" name="longitude" type="number" step="any"></ion-input>
    </ion-item>

    <ion-button expand="full" (click)="save()" class="ion-margin-top">Save</ion-button>
  </form>
</ion-content>
